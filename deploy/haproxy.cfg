global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 90s
    timeout server 90s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 2s
    hold obsolete 2s

frontend public_api
    bind :8000
    default_backend crop_api

backend crop_api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-LeafVision-Replica %[srv_name]
    server-template api 1-3 api:8000 check inter 5s rise 1 fall 2 init-state fully-down resolvers docker resolve-prefer ipv4 init-addr none
